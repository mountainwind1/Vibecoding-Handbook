<svg width="680" viewBox="0 0 680 1248" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vibe Coding v5 建设期主流程</title>
<desc>从阶段0初始化到阶段3.5里程碑收口的流程图：宪法、PRD、设计系统、拆任务，然后进入里程碑循环（分档执行、收尾、旅程走查、合并），全部里程碑完成后上线 1.0.0。</desc>
<style>
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.leader{stroke:#B4B2A9;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:1}
.gp>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.gp>.th{fill:#3C3489}.gp>.ts{fill:#534AB7}
.gt>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.gt>.th{fill:#085041}.gt>.ts{fill:#0F6E56}
.gc>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gc>.th{fill:#712B13}.gc>.ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1248" fill="#FFFFFF"/>
<rect x="170" y="38" width="12" height="12" rx="3" fill="#534AB7"/>
<text x="188" y="44" class="ts" dominant-baseline="central">规划与文档</text>
<rect x="293" y="38" width="12" height="12" rx="3" fill="#0F6E56"/>
<text x="311" y="44" class="ts" dominant-baseline="central">任务执行</text>
<rect x="403" y="38" width="12" height="12" rx="3" fill="#993C1D"/>
<text x="421" y="44" class="ts" dominant-baseline="central">门禁与收尾</text>
<g class="gp"><rect x="230" y="64" width="220" height="52" rx="6"/><text x="340" y="83" class="th" text-anchor="middle" dominant-baseline="central">阶段 0 · 项目初始化</text><text x="340" y="101" class="ts" text-anchor="middle" dominant-baseline="central">CLAUDE.md 宪法 + 机制层</text></g>
<line class="arr" x1="340" y1="120" x2="340" y2="172" marker-end="url(#arrow)"/>
<g class="gp"><rect x="230" y="176" width="220" height="52" rx="6"/><text x="340" y="195" class="th" text-anchor="middle" dominant-baseline="central">阶段 1 · 需求规划</text><text x="340" y="213" class="ts" text-anchor="middle" dominant-baseline="central">PRD.md · 三轨验收</text></g>
<rect class="box" x="486" y="176" width="150" height="52" rx="6"/><text x="561" y="195" class="th" text-anchor="middle" dominant-baseline="central">阶段 5 · 评审</text><text x="561" y="213" class="ts" text-anchor="middle" dominant-baseline="central">换模型审查 PRD</text>
<line class="leader" x1="454" y1="202" x2="482" y2="202" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="232" x2="340" y2="284" marker-end="url(#arrow)"/>
<g class="gp"><rect x="230" y="288" width="220" height="52" rx="6"/><text x="340" y="307" class="th" text-anchor="middle" dominant-baseline="central">阶段 1.5 · 设计系统</text><text x="340" y="325" class="ts" text-anchor="middle" dominant-baseline="central">DESIGN.md → 回填 CLAUDE.md</text></g>
<line class="arr" x1="340" y1="344" x2="340" y2="396" marker-end="url(#arrow)"/>
<g class="gp"><rect x="230" y="400" width="220" height="52" rx="6"/><text x="340" y="419" class="th" text-anchor="middle" dominant-baseline="central">阶段 2 · 拆任务</text><text x="340" y="437" class="ts" text-anchor="middle" dominant-baseline="central">PLAN.md + DECISIONS.md</text></g>
<rect x="60" y="512" width="560" height="608" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="80" y="536" class="ts" dominant-baseline="central">里程碑循环 · 每个里程碑一遍</text>
<line class="arr" x1="340" y1="456" x2="340" y2="552" marker-end="url(#arrow)"/>
<g class="gt"><rect x="200" y="556" width="280" height="76" rx="6"/><text x="340" y="574" class="th" text-anchor="middle" dominant-baseline="central">阶段 3 · 任务执行</text><text x="340" y="596" class="ts" text-anchor="middle" dominant-baseline="central">3A 重型 / 3B 常规 / 3C 批量</text><text x="340" y="614" class="ts" text-anchor="middle" dominant-baseline="central">前端：屏级 B2 → 实现 → B3</text></g>
<line class="arr" x1="340" y1="636" x2="340" y2="688" marker-end="url(#arrow)"/>
<g class="gt"><rect x="200" y="692" width="280" height="52" rx="6"/><text x="340" y="711" class="th" text-anchor="middle" dominant-baseline="central">任务收尾</text><text x="340" y="729" class="ts" text-anchor="middle" dominant-baseline="central">测试绿 → commit → 勾 PLAN → /clear</text></g>
<line class="arr" x1="340" y1="748" x2="340" y2="800" marker-end="url(#arrow)"/>
<rect class="box" x="230" y="804" width="220" height="44" rx="6"/><text x="340" y="826" class="th" text-anchor="middle" dominant-baseline="central">本里程碑任务全勾？</text>
<path class="arr" d="M230 826 H130 V594 H196" marker-end="url(#arrow)"/>
<text x="138" y="770" class="ts" dominant-baseline="central">否</text>
<line class="arr" x1="340" y1="852" x2="340" y2="904" marker-end="url(#arrow)"/>
<text x="350" y="876" class="ts" dominant-baseline="central">是</text>
<g class="gc"><rect x="200" y="908" width="280" height="76" rx="6"/><text x="340" y="926" class="th" text-anchor="middle" dominant-baseline="central">阶段 3.5 · 里程碑收口</text><text x="340" y="948" class="ts" text-anchor="middle" dominant-baseline="central">旅程走查 · 断路必补</text><text x="340" y="966" class="ts" text-anchor="middle" dominant-baseline="central">涉敏必跑 A5 安全审计</text></g>
<line class="arr" x1="340" y1="988" x2="340" y2="1040" marker-end="url(#arrow)"/>
<g class="gc"><rect x="180" y="1044" width="320" height="52" rx="6"/><text x="340" y="1063" class="th" text-anchor="middle" dominant-baseline="central">合并里程碑</text><text x="340" y="1081" class="ts" text-anchor="middle" dominant-baseline="central">CI 绿 → PR 合并 → 记 0.{n}.0</text></g>
<path class="arr" d="M500 1070 H580 V598 H484" marker-end="url(#arrow)"/>
<text x="575" y="660" class="ts" text-anchor="end" dominant-baseline="central">下一里程碑</text>
<line class="arr" x1="340" y1="1100" x2="340" y2="1152" marker-end="url(#arrow)"/>
<text x="352" y="1136" class="ts" dominant-baseline="central">全部里程碑完成</text>
<rect class="box" x="230" y="1156" width="220" height="52" rx="6"/><text x="340" y="1175" class="th" text-anchor="middle" dominant-baseline="central">上线 · 1.0.0</text><text x="340" y="1193" class="ts" text-anchor="middle" dominant-baseline="central">转入阶段 4 迭代期</text>
</svg>
