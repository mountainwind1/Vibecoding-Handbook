<svg width="680" viewBox="0 0 680 852" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vibe Coding v5 上线后迭代流水线</title>
<desc>阶段4迭代流程图：改动请求先定性、写变更单，再按改动半径分为微调、常规、大改动三条路径，最后统一走收尾铁律并回到下一个改动请求。</desc>
<style>
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:1}
.gp>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.gp>.th{fill:#3C3489}.gp>.ts{fill:#534AB7}
.gt>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.gt>.th{fill:#085041}.gt>.ts{fill:#0F6E56}
.gc>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gc>.th{fill:#712B13}.gc>.ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="852" fill="#FFFFFF"/>
<rect x="170" y="38" width="12" height="12" rx="3" fill="#534AB7"/>
<text x="188" y="44" class="ts" dominant-baseline="central">定性与分析</text>
<rect x="303" y="38" width="12" height="12" rx="3" fill="#0F6E56"/>
<text x="321" y="44" class="ts" dominant-baseline="central">执行</text>
<rect x="391" y="38" width="12" height="12" rx="3" fill="#993C1D"/>
<text x="409" y="44" class="ts" dominant-baseline="central">收尾与版本</text>
<rect class="box" x="282" y="64" width="140" height="44" rx="6"/><text x="352" y="86" class="th" text-anchor="middle" dominant-baseline="central">改动请求</text>
<line class="arr" x1="352" y1="112" x2="352" y2="164" marker-end="url(#arrow)"/>
<g class="gp"><rect x="242" y="168" width="220" height="52" rx="6"/><text x="352" y="187" class="th" text-anchor="middle" dominant-baseline="central">4.0 先定性</text><text x="352" y="205" class="ts" text-anchor="middle" dominant-baseline="central">bug？还是需求变更？</text></g>
<line class="arr" x1="352" y1="224" x2="352" y2="276" marker-end="url(#arrow)"/>
<g class="gp"><rect x="242" y="280" width="220" height="52" rx="6"/><text x="352" y="299" class="th" text-anchor="middle" dominant-baseline="central">4.1 变更单</text><text x="352" y="317" class="ts" text-anchor="middle" dominant-baseline="central">复述确认 · 边界 · 验收反例</text></g>
<line class="arr" x1="352" y1="336" x2="352" y2="388" marker-end="url(#arrow)"/>
<rect class="box" x="242" y="392" width="220" height="44" rx="6"/><text x="352" y="414" class="th" text-anchor="middle" dominant-baseline="central">4.2 按改动半径分级</text>
<path class="arr" d="M242 414 H152 V604" marker-end="url(#arrow)"/>
<path class="arr" d="M352 436 V466 H452 V492" marker-end="url(#arrow)"/>
<g class="gp"><rect x="264" y="496" width="376" height="52" rx="6"/><text x="452" y="515" class="th" text-anchor="middle" dominant-baseline="central">4.3 影响面分析</text><text x="452" y="533" class="ts" text-anchor="middle" dominant-baseline="central">模块 / 契约 / 数据 / 测试 / 旅程 / 文档</text></g>
<path class="arr" d="M452 548 V572 H352 V604" marker-end="url(#arrow)"/>
<path class="arr" d="M452 548 V572 H552 V604" marker-end="url(#arrow)"/>
<g class="gt"><rect x="64" y="608" width="176" height="72" rx="6"/><text x="152" y="626" class="th" text-anchor="middle" dominant-baseline="central">微调 → 直接做</text><text x="152" y="648" class="ts" text-anchor="middle" dominant-baseline="central">单模块 · 不动契约</text><text x="152" y="666" class="ts" text-anchor="middle" dominant-baseline="central">可攒批 · 记 1.0.x</text></g>
<g class="gt"><rect x="264" y="608" width="176" height="72" rx="6"/><text x="352" y="626" class="th" text-anchor="middle" dominant-baseline="central">常规 → 两步执行</text><text x="352" y="648" class="ts" text-anchor="middle" dominant-baseline="central">契约只增 · ≤2 层</text><text x="352" y="666" class="ts" text-anchor="middle" dominant-baseline="central">方案确认 → 分步改</text></g>
<g class="gt"><rect x="464" y="608" width="176" height="72" rx="6"/><text x="552" y="626" class="th" text-anchor="middle" dominant-baseline="central">大改动 → 迷你 0→1</text><text x="552" y="648" class="ts" text-anchor="middle" dominant-baseline="central">跨模块 / 动契约 / 新功能</text><text x="552" y="666" class="ts" text-anchor="middle" dominant-baseline="central">回归走查 + 涉敏 A5</text></g>
<path class="arr" d="M152 680 V704 H272 V736" marker-end="url(#arrow)"/>
<line class="arr" x1="352" y1="680" x2="352" y2="736" marker-end="url(#arrow)"/>
<path class="arr" d="M552 680 V704 H432 V736" marker-end="url(#arrow)"/>
<g class="gc"><rect x="192" y="740" width="320" height="72" rx="6"/><text x="352" y="758" class="th" text-anchor="middle" dominant-baseline="central">4.6 收尾铁律</text><text x="352" y="780" class="ts" text-anchor="middle" dominant-baseline="central">版本号跟半径走</text><text x="352" y="798" class="ts" text-anchor="middle" dominant-baseline="central">代码 + 文档同批 commit</text></g>
<path class="arr" d="M192 776 H44 V86 H278" marker-end="url(#arrow)"/>
<text x="56" y="130" class="ts" dominant-baseline="central">下一个改动请求</text>
</svg>
